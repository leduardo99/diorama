<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama - Render Runner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }
      #asset-root {
        position: relative;
        overflow: hidden;
        display: block;
        transform-origin: 0 0;
      }
      /* Vite shows a module error of any page to every open page: one sheet failing must not cover another's render. */
      vite-error-overlay {
        display: none !important;
      }
      .error-card {
        padding: 16px;
        background: #2b1114;
        color: #ff858d;
        border: 1px solid #791a24;
        border-radius: 6px;
        font-family: monospace;
        font-size: 13px;
        max-width: 90vw;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="asset-root"></div>

    <script type="module">
      const BAYER_4X4 = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5],
      ].map(r => r.map(v => (v + 0.5) / 16));

      function snapAlpha(ctx, threshold = 128) {
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        if (!w || !h) return;
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        for (let i = 3; i < data.length; i += 4) {
          data[i] = data[i] >= threshold ? 255 : 0;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      function bayerDitherAlpha(ctx) {
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        if (!w || !h) return;
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        for (let y = 0; y < h; y++) {
          const rowOffset = y * w * 4;
          const bRow = BAYER_4X4[y % 4];
          for (let x = 0; x < w; x++) {
            const idx = rowOffset + x * 4 + 3;
            const a = data[idx];
            if (a === 0 || a === 255) continue;
            data[idx] = (a / 255) >= bRow[x % 4] ? 255 : 0;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      }

      window.__ASSET_READY__ = false;
      window.__ASSET_ERROR__ = null;
      window.__ASSET_METADATA__ = null;

      /** The asset a sheet module exports. A module is fetched once per page and then comes from the module cache. */
      async function importAsset(dir, file) {
        // Clean path to ensure leading slash
        const cleanFile = file.startsWith('/') ? file : '/' + file;
        const moduleUrl = `/${dir}/sheets${cleanFile}`;

        console.log(`[AssetRunner] Loading asset module: ${moduleUrl}`);

        let mod;
        try {
          mod = await import(/* @vite-ignore */ moduleUrl);
        } catch (err) {
          throw new Error(`Failed to import asset module "${moduleUrl}": ${err.message || err}`);
        }

        const asset = mod.default || mod.asset;
        if (!asset) {
          throw new Error(`Module "${moduleUrl}" must export an asset as default export (export default defineAsset({ ... }))`);
        }

        if (typeof asset.render !== 'function') {
          throw new Error(`Asset definition in "${moduleUrl}" is missing a "render(root, context)" function`);
        }
        return asset;
      }

      /** What the asset declares: its cell, frames, directions and scale, and the size of the whole sheet. */
      function declaredSize(asset) {
        const width = Number(asset.width) || 256;
        const height = Number(asset.height) || 256;
        const scale = Number(asset.scale) || 1;
        const frameCount = Math.max(1, Number(asset.frames) || 1);
        // Directions are rows: row 0 faces the camera (S) and each next row turns clockwise on screen.
        const directionCount = Math.max(1, Math.floor(Number(asset.directions) || 1));
        return { width, height, scale, frameCount, directionCount, totalWidth: width * frameCount, totalHeight: height * directionCount };
      }

      /**
       * Renders one sheet into a fresh #asset-root and returns its metadata. The body is reset first, so a page
       * renders many sheets one after another and each starts from the DOM of a page that was just loaded.
       */
      async function render({ project, dir, file, preview }) {
        window.__ASSET_READY__ = false;
        window.__ASSET_ERROR__ = null;
        window.__ASSET_METADATA__ = null;
        const root = document.createElement('div');
        root.id = 'asset-root';
        document.body.replaceChildren(root);

        const asset = await importAsset(dir, file);
        const { width, height, scale, frameCount, directionCount, totalWidth, totalHeight } = declaredSize(asset);
        const format = asset.format || 'png';
        const quality = typeof asset.quality === 'number' ? asset.quality : 90;
        const background = asset.background ?? (format === 'jpeg' ? '#ffffff' : 'transparent');

        const DIRECTION_NAMES = { 1: ['S'], 4: ['S', 'W', 'N', 'E'], 8: ['S', 'SW', 'W', 'NW', 'N', 'NE', 'E', 'SE'] };
        const directionNames = Array.from({ length: directionCount }, (_, d) => DIRECTION_NAMES[directionCount]?.[d] ?? `D${d}`);
        const facingOf = (d) => Math.PI / 2 + (d * 2 * Math.PI) / directionCount;

        // Style the root container
        root.style.width = `${totalWidth}px`;
        root.style.height = `${totalHeight}px`;
        root.style.backgroundColor = background;
        if (frameCount > 1 || directionCount > 1) {
          root.style.display = 'flex';
          root.style.flexDirection = 'row';
          root.style.flexWrap = 'wrap';
        }

        if (frameCount > 1 || directionCount > 1) {
          for (let d = 0; d < directionCount; d++)
          for (let f = 0; f < frameCount; f++) {
            const frameCell = document.createElement('div');
            frameCell.className = 'frame-cell';
            frameCell.style.width = `${width}px`;
            frameCell.style.height = `${height}px`;
            frameCell.style.position = 'relative';
            frameCell.style.overflow = 'hidden';
            root.appendChild(frameCell);

            const context = {
              width,
              height,
              scale,
              format,
              project,
              sourcePath: file,
              preview,
              resolveResource: (rel) => `/${dir}/src/${rel.replace(/^\//, '')}`,
              frameIndex: f,
              frameCount,
              direction: d,
              directionCount,
              facing: facingOf(d),
              directionName: directionNames[d],
            };

            await asset.render(frameCell, context);
          }
        } else {
          // Context object provided to asset render
          const context = {
            width,
            height,
            scale,
            format,
            project,
            sourcePath: file,
            preview,
            resolveResource: (rel) => `/${dir}/src/${rel.replace(/^\//, '')}`,
            frameIndex: 0,
            frameCount: 1,
            direction: 0,
            directionCount: 1,
            facing: facingOf(0),
            directionName: directionNames[0],
          };

          // Execute user render
          await asset.render(root, context);
        }

        // Apply post-process anti-aliasing if configured
        if (asset.antialiasing === 'none' || asset.antialiasing === 'dither') {
          const canvases = Array.from(root.querySelectorAll('canvas'));
          for (const cvs of canvases) {
            const cCtx = cvs.getContext('2d');
            if (cCtx) {
              if (asset.antialiasing === 'none') {
                snapAlpha(cCtx, asset.alphaThreshold ?? 128);
              } else if (asset.antialiasing === 'dither') {
                bayerDitherAlpha(cCtx);
              }
            }
          }
        }

        // Wait for all web fonts to load
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        // Wait for any embedded <img> tags to complete decoding
        const images = Array.from(root.querySelectorAll('img'));
        if (images.length > 0) {
          await Promise.all(
            images.map((img) => {
              if (img.complete) return Promise.resolve();
              return img.decode().catch(() => {});
            })
          );
        }

        // Wait two animation frames to ensure DOM styles and canvas buffers are fully flushed
        await new Promise((resolve) => {
          requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
          });
        });

        window.__ASSET_METADATA__ = {
          width: totalWidth,
          height: totalHeight,
          format,
          quality,
          scale,
          background,
          name: asset.name,
          frameCount,
          frameWidth: width,
          frameHeight: height,
          fps: Number(asset.fps) || 5,
          animations: asset.animations ?? null,
          directionCount,
          directionNames,
          directionFacings: directionNames.map((_, d) => facingOf(d)),
          pivot: asset.pivot ?? null,
          data: asset.data ?? null,
        };
        window.__ASSET_READY__ = true;
        console.log(`[AssetRunner] Asset ready: ${totalWidth}x${totalHeight} (${format}, ${frameCount} frames)`);
        return window.__ASSET_METADATA__;
      }

      function fail(err) {
        console.error('[AssetRunner Error]', err);
        window.__ASSET_ERROR__ = err.stack || err.message || String(err);
        const root = document.getElementById('asset-root');
        if (root) root.innerHTML = `<div class="error-card"><strong>Render Error:</strong>\n${window.__ASSET_ERROR__}</div>`;
        return window.__ASSET_ERROR__;
      }

      // tools/export.ts keeps the page open and calls these for each sheet: `declare` imports the sheet and says
      // what it declares (the exporter picks the device scale from it), `render` draws it and resolves with
      // { metadata } or { error }.
      window.__ASSET_RUNNER__ = {
        declare: async ({ dir, file }) => {
          try {
            return { declared: declaredSize(await importAsset(dir, file)) };
          } catch (err) {
            return { error: err.stack || err.message || String(err) };
          }
        },
        render: async (request) => {
          try {
            return { metadata: await render(request) };
          } catch (err) {
            return { error: fail(err) };
          }
        },
      };

      // Opened with ?project=&file= (by hand, to look at one sheet), the page renders that sheet at once.
      const params = new URLSearchParams(window.location.search);
      const project = params.get('project');
      if (params.has('file') || project) {
        const file = params.get('file');
        // The project's folder from the repository root (examples/<name> or projects/<name>); sheets live in <dir>/sheets/.
        const dir = (params.get('dir') || `projects/${project}`).replace(/^\/+|\/+$/g, '');
        if (!project || !file) {
          fail(new Error('Missing "project" or "file" query parameter in URL'));
        } else {
          render({ project, dir, file, preview: params.get('preview') === 'true' }).catch(fail);
        }
      }
    </script>
  </body>
</html>
